services:
  database:
    image: postgres:18-trixie
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: ${POSTGRES_DB:-mumu_bot}
      POSTGRES_USER: ${POSTGRES_USER:-mumu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  snowluma:
    image: motricseven7/snowluma:latest
    restart: unless-stopped
    shm_size: 1gb
    ulimits:
      nofile:
        soft: 65536
        hard: 1048576
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    environment:
      SNOWLUMA_ONEBOT_HOST: 0.0.0.0
      SNOWLUMA_UID: 1000
      SNOWLUMA_GID: 1000
      SNOWLUMA_WEBUI_HOST: 0.0.0.0
      SNOWLUMA_WEBUI_PORT: ${SNOWLUMA_WEBUI_PORT:-5099}
      SNOWLUMA_HOOK_AUTOLOAD: "1"
      SNOWLUMA_QQ_FLAGS: "--disable-gpu --disable-software-rasterizer --disable-gpu-compositing"
      TZ: Asia/Shanghai
    ports:
      - ${NOVNC_PORT:-6081}:6081
      - ${SNOWLUMA_WEBUI_PORT:-5099}:${SNOWLUMA_WEBUI_PORT:-5099}
    volumes:
      - snowluma-gateway-data:/app/data
      - snowluma-client-config:/app/.config
      - snowluma-client-data:/app/.local/share

  mumu-bot:
    image: ghcr.io/sugarmgp/mumubot:latest
    pull_policy: always
    restart: unless-stopped
    init: true
    read_only: true
    depends_on:
      database:
        condition: service_healthy
      snowluma:
        condition: service_started
    environment:
      MUMU_DATABASE_DSN: postgres://${POSTGRES_USER:-mumu}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@database:5432/${POSTGRES_DB:-mumu_bot}?sslmode=disable
      MUMU_ONEBOT_WS_URL: ${MUMU_ONEBOT_WS_URL:-ws://snowluma:3001}
      MUMU_ONEBOT_TOKEN: ${MUMU_ONEBOT_TOKEN:-}
      MUMU_WEB_ADMIN_KEY: ${MUMU_WEB_ADMIN_KEY:?set MUMU_WEB_ADMIN_KEY in .env}
      MUMU_SECRET_KEY: ${MUMU_SECRET_KEY:?set MUMU_SECRET_KEY in .env}
      MUMU_SERVER_PORT: ${MUMU_SERVER_PORT:-7468}
      MUMU_ONEBOT_RECONNECT_SECONDS: ${MUMU_ONEBOT_RECONNECT_SECONDS:-5}
      MUMU_MEDIA_DIR: /app/media
      MUMU_STICKER_DIR: /app/stickers
      MUMU_LOG_LEVEL: ${MUMU_LOG_LEVEL:-info}
      MUMU_DEBUG: ${MUMU_DEBUG:-false}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - ${MUMU_WEB_PORT:-7468}:${MUMU_SERVER_PORT:-7468}
    volumes:
      - stickers:/app/stickers
      - media:/app/media
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${MUMU_SERVER_PORT:-7468}/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
  snowluma-gateway-data:
  snowluma-client-config:
  snowluma-client-data:
  stickers:
  media:
