name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    name: Prepare Release Assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - name: Install frontend dependencies
      run: bun install --frozen-lockfile

    - name: Generate admin icons
      run: bun run gen:icons

    - name: Build frontend assets
      run: bun run build

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Install templ
      run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

    - name: Generate templ views
      run: templ generate ./internal/web/views

    - name: Prepare build directory
      run: |
        mkdir -p dist/config
        cp config/config.example.yaml dist/config/config.yaml
        cp config/persona_group.prompt dist/config/persona_group.prompt
        cp config/persona_private.prompt dist/config/persona_private.prompt
        cp config/mcp.example.json dist/config/mcp.json
        cp README.md dist/
        cp LICENSE dist/

    - name: Upload prepared assets
      uses: actions/upload-artifact@v4
      with:
        name: release-assets
        path: |
          dist
          internal/web/assets/dist
          internal/web/views
        retention-days: 1

  build:
    name: Build ${{ matrix.asset_name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            output_name: mumu-bot
            asset_name: mumu-bot-linux-amd64
            archive_ext: .tar.gz
          - os: windows-latest
            goos: windows
            goarch: amd64
            output_name: mumu-bot.exe
            asset_name: mumu-bot-windows-amd64
            archive_ext: .zip
          - os: macos-13
            goos: darwin
            goarch: amd64
            output_name: mumu-bot
            asset_name: mumu-bot-darwin-amd64
            archive_ext: .tar.gz
          - os: macos-latest
            goos: darwin
            goarch: arm64
            output_name: mumu-bot
            asset_name: mumu-bot-darwin-arm64
            archive_ext: .tar.gz

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Download prepared assets
      uses: actions/download-artifact@v4
      with:
        name: release-assets
        path: .

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Install libwebp (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebp-dev

    - name: Install libwebp (macOS)
      if: runner.os == 'macOS'
      run: brew install webp pkgconf

    - name: Install MSYS2 and libwebp (Windows)
      if: runner.os == 'Windows'
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: mingw-w64-x86_64-gcc mingw-w64-x86_64-libwebp

    - name: Set Windows build environment
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
      run: |
        echo "CGO_ENABLED=1" >> $env:GITHUB_ENV
        echo "CC=$env:MSYS2_LOCATION\mingw64\bin\gcc.exe" >> $env:GITHUB_ENV
        echo "PKG_CONFIG_PATH=$env:MSYS2_LOCATION\mingw64\lib\pkgconfig" >> $env:GITHUB_ENV
        echo "$env:MSYS2_LOCATION\mingw64\bin" >> $env:GITHUB_PATH

    - name: Build
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 1
        CGO_LDFLAGS: "-Wl,-Bstatic -lwebp -Wl,-Bdynamic"
      run: |
        go build -v -trimpath -ldflags "-s -w -X mumu-bot/internal/version.Build=${GITHUB_REF_NAME}" -o dist/${{ matrix.output_name }} .

    - name: Verify libwebp is statically linked
      shell: bash
      run: |
        set -euo pipefail
        binary="dist/${{ matrix.output_name }}"
        case "${{ matrix.goos }}" in
          linux) deps="$(ldd "$binary" 2>/dev/null || true)" ;;
          darwin) deps="$(otool -L "$binary" 2>/dev/null || true)" ;;
          windows) deps="$(objdump -p "$binary" 2>/dev/null || true)" ;;
        esac
        if echo "$deps" | grep -i "webp"; then
          echo "产物仍动态依赖 libwebp："
          echo "$deps" | grep -i "webp"
          exit 1
        fi

    - name: Archive (Unix)
      if: runner.os != 'Windows'
      run: |
        cd dist
        tar -czvf ../${{ matrix.asset_name }}${{ matrix.archive_ext }} .

    - name: Archive (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: Compress-Archive -Path dist/* -DestinationPath ${{ matrix.asset_name }}${{ matrix.archive_ext }}

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v3
      with:
        files: ${{ matrix.asset_name }}${{ matrix.archive_ext }}
        draft: true
        fail_on_unmatched_files: true

  container:
    name: Publish Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=container
          cache-to: type=gha,mode=max,scope=container

  prepare-release:
    name: Prepare Release
    needs: container
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build release notes from CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"

          extract_section() {
            local file="$1"
            local version="$2"

            awk -v version="$version" '
              BEGIN {
                capture = 0
                found = 0
              }

              /^##[[:space:]]+\[/ {
                if (capture) {
                  exit
                }
                if (index($0, "## [" version "]") == 1 || index($0, "## [v" version "]") == 1) {
                  suffix = substr($0, index($0, "]") + 1)
                  if (suffix == "" || suffix ~ /^[[:space:]]*$/ || suffix ~ /^[[:space:]]+-/) {
                    capture = 1
                    found = 1
                  }
                }
              }

              capture {
                print
              }

              END {
                if (!found) {
                  exit 2
                }
              }
            ' "$file"
          }

          if ! release_notes="$(extract_section CHANGELOG.md "$VERSION")"; then
            echo "Missing changelog section for ${GITHUB_REF_NAME} in CHANGELOG.md"
            echo "Add a section like: ## [${VERSION}] - YYYY-MM-DD"
            exit 1
          fi

          printf '%s\n' "$release_notes" > release-notes.md

      - name: Create draft Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          draft: true
          prerelease: false

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          make_latest: true
