name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: Prepare Release Assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.4

    - name: Install frontend dependencies
      working-directory: web
      run: bun install --frozen-lockfile

    - name: Build frontend assets
      working-directory: web
      run: bun run build

    - name: Prepare build directory
      run: |
        mkdir -p dist
        cp README.md README.en.md LICENSE .env.example docker-compose.yml dist/

    - name: Upload prepared assets
      uses: actions/upload-artifact@v4
      with:
        name: release-assets
        path: |
          dist
          internal/web/assets/dist
        include-hidden-files: true
        retention-days: 1

  build:
    name: Build ${{ matrix.asset_name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            output_name: mumu-bot
            asset_name: mumu-bot-linux-amd64
            archive_ext: .tar.gz
          - os: windows-latest
            goos: windows
            goarch: amd64
            output_name: mumu-bot.exe
            asset_name: mumu-bot-windows-amd64
            archive_ext: .zip

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Download prepared assets
      uses: actions/download-artifact@v4
      with:
        name: release-assets
        path: .

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Install libwebp (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebp-dev
        # libwebp-dev 带 libwebp.a 与 libsharpyuv.a，整份静态链进去，产物不依赖任何系统库
        echo "CGO_LDFLAGS=-static -lwebp -lsharpyuv -lm" >> $GITHUB_ENV
        # 避免 glibc 的 DNS 与账号查询在静态产物运行时依赖 NSS 动态库
        echo "GOFLAGS=-tags=netgo,osusergo" >> $GITHUB_ENV

    - name: Install MSYS2 and libwebp (Windows)
      if: runner.os == 'Windows'
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: mingw-w64-x86_64-gcc mingw-w64-x86_64-libwebp

    - name: Set Windows build environment
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
      run: |
        echo "CGO_ENABLED=1" >> $env:GITHUB_ENV
        echo "CC=$env:MSYS2_LOCATION\mingw64\bin\gcc.exe" >> $env:GITHUB_ENV
        echo "PKG_CONFIG_PATH=$env:MSYS2_LOCATION\mingw64\lib\pkgconfig" >> $env:GITHUB_ENV
        echo "$env:MSYS2_LOCATION\mingw64\bin" >> $env:GITHUB_PATH
        # -static 让链接器只找 .a，MSYS2 的 libwebp 与 libsharpyuv 都带静态库
        echo "CGO_LDFLAGS=-static -lwebp -lsharpyuv -lm" >> $env:GITHUB_ENV

    - name: Build
      env:
        VERSION: ${{ github.ref_name }}
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 1
      run: |
        go build -v -trimpath -ldflags "-s -w -X mumu-bot/internal/version.Build=${{ env.VERSION }}" -o dist/${{ matrix.output_name }} .

    - name: Archive (Unix)
      if: runner.os == 'Linux'
      run: |
        cd dist
        tar -czvf ../${{ matrix.asset_name }}${{ matrix.archive_ext }} .

    - name: Archive (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: Compress-Archive -Path dist/* -DestinationPath ${{ matrix.asset_name }}${{ matrix.archive_ext }}

    - name: Upload Release Asset
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: ${{ matrix.asset_name }}${{ matrix.archive_ext }}
        if-no-files-found: error
        retention-days: 1

  container:
    name: Build ${{ matrix.image }} image (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: [main, worker]
        platform:
          - arch: amd64
            runner: ubuntu-latest
            machine: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify native architecture and set image name
        run: |
          test "$(uname -m)" = "${{ matrix.platform.machine }}"
          echo "IMAGE_NAME=$REGISTRY/${GITHUB_REPOSITORY,,}${{ matrix.image == 'worker' && '-worker' || '' }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image == 'worker' && './Dockerfile.worker' || './Dockerfile' }}
          platforms: linux/${{ matrix.platform.arch }}
          build-args: ${{ matrix.image == 'main' && format('VERSION={0}', github.ref_name) || '' }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image-${{ matrix.image }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.image }}-${{ matrix.platform.arch }}

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digests-${{ matrix.image }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-images:
    name: Publish ${{ matrix.image }} image
    needs: container
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [main, worker]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set image name
        run: echo "IMAGE_NAME=$REGISTRY/${GITHUB_REPOSITORY,,}${{ matrix.image == 'worker' && '-worker' || '' }}" >> "$GITHUB_ENV"

      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: image-digests-${{ matrix.image }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Publish multi-platform image
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          args=()
          for tag in "${tags[@]}"; do
            args+=(--tag "$tag")
          done
          for digest in *; do
            args+=("$IMAGE_NAME@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect --raw "$IMAGE_NAME:$GITHUB_REF_NAME" | jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'

  release:
    name: Publish Release
    needs: [build, publish-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build release notes from CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"

          extract_section() {
            local file="$1"
            local version="$2"

            awk -v version="$version" '
              BEGIN {
                capture = 0
                found = 0
              }

              /^##[[:space:]]+\[/ {
                if (capture) {
                  exit
                }
                if (index($0, "## [" version "]") == 1 || index($0, "## [v" version "]") == 1) {
                  suffix = substr($0, index($0, "]") + 1)
                  if (suffix == "" || suffix ~ /^[[:space:]]*$/ || suffix ~ /^[[:space:]]+-/) {
                    capture = 1
                    found = 1
                  }
                }
              }

              capture {
                print
              }

              END {
                if (!found) {
                  exit 2
                }
              }
            ' "$file"
          }

          if ! release_notes="$(extract_section CHANGELOG.md "$VERSION")"; then
            echo "Missing changelog section for ${GITHUB_REF_NAME} in CHANGELOG.md"
            echo "Add a section like: ## [${VERSION}] - YYYY-MM-DD"
            exit 1
          fi

          printf '%s\n' "$release_notes" > release-notes.md

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: mumu-bot-*
          merge-multiple: true
          path: release-archives

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: release-archives/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
