name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output_name: mumu-bot
            asset_name: mumu-bot-linux-amd64
            archive_ext: .tar.gz
          - goos: windows
            goarch: amd64
            output_name: mumu-bot.exe
            asset_name: mumu-bot-windows-amd64
            archive_ext: .zip
          - goos: darwin
            goarch: amd64
            output_name: mumu-bot
            asset_name: mumu-bot-darwin-amd64
            archive_ext: .tar.gz
          - goos: darwin
            goarch: arm64
            output_name: mumu-bot
            asset_name: mumu-bot-darwin-arm64
            archive_ext: .tar.gz

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm

    - name: Install frontend dependencies
      run: npm ci

    - name: Build frontend assets
      run: npm run build

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'

    - name: Install templ
      run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

    - name: Generate templ views
      run: templ generate ./internal/web/views

    - name: Prepare build directory
      run: |
        mkdir -p dist/config
        cp config/config.example.yaml dist/config/config.yaml
        cp config/persona.prompt dist/config/persona.prompt
        cp config/mcp.example.json dist/config/mcp.json
        cp README.md dist/
        cp LICENSE dist/

    - name: Build
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        go build -v -trimpath -ldflags "-s -w" -o dist/${{ matrix.output_name }} .

    - name: Archive
      run: |
        cd dist
        if [ "${{ matrix.goos }}" == "windows" ]; then
          zip -r ../${{ matrix.asset_name }}${{ matrix.archive_ext }} .
        else
          tar -czvf ../${{ matrix.asset_name }}${{ matrix.archive_ext }} .
        fi

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v3
      with:
        files: ${{ matrix.asset_name }}${{ matrix.archive_ext }}
        draft: true
        fail_on_unmatched_files: true

  container:
    name: Publish Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=container
          cache-to: type=gha,mode=max,scope=container

  prepare-release:
    name: Prepare Release
    needs: container
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build release notes from CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"

          extract_section() {
            local file="$1"
            local version="$2"

            awk -v version="$version" '
              BEGIN {
                capture = 0
                found = 0
              }

              /^##[[:space:]]+\[/ {
                if (capture) {
                  exit
                }
                if ($0 ~ ("^##[[:space:]]+\\[v?" version "\\]([[:space:]]+-|[[:space:]]*$)")) {
                  capture = 1
                  found = 1
                }
              }

              capture && /^\[[^]]+\]:[[:space:]]+/ {
                exit
              }

              capture {
                print
              }

              END {
                if (!found) {
                  exit 2
                }
              }
            ' "$file"
          }

          if ! release_notes="$(extract_section CHANGELOG.md "$VERSION")"; then
            echo "Missing changelog section for ${GITHUB_REF_NAME} in CHANGELOG.md"
            echo "Add a section like: ## [${VERSION}] - YYYY-MM-DD"
            exit 1
          fi

          printf '%s\n' "$release_notes" > release-notes.md

      - name: Create draft Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          draft: true
          prerelease: false

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          make_latest: true
