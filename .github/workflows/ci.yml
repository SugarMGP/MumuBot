name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  check:
    name: Build and Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Typecheck frontend
        working-directory: web
        run: bun run typecheck

      - name: Lint frontend
        working-directory: web
        run: bun run lint

      - name: Check hardcoded copy
        working-directory: web
        run: bun run lint:i18n

      - name: Build frontend
        working-directory: web
        run: bun run build

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install libwebp
        run: sudo apt-get update && sudo apt-get install -y libwebp-dev

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...
