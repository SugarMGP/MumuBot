# MumuBot 配置文件

# 基础配置
app:
  debug: true
  log_level: "debug"  # debug, info, warn, error

# 人格配置
# 群聊静态人格模板位于 config/persona_group.prompt，私聊静态人格模板位于 config/persona_private.prompt
# 这里保留运行时需要注入模板的名称、别名和兴趣等配置；机器人 QQ 由 OneBot 自动识别
persona:
  name: "沐沐大魔王"
  alias_names:        # 别名列表，这些都可以触发@检测
    - "mumu"
    - "牢沐"
    - "沐沐"
  # 兴趣话题（作为静态人格背景，不改变消息触发概率）
  interests:
    - "编程"
    - "数码科技"
    - "二次元"
    - "单机游戏"
    - "少女乐队番"
    - "异世界番"
    - "Minecraft"

# OneBot 配置
onebot:
  ws_url: "ws://127.0.0.1:3001"
  access_token: ""
  reconnect_interval: 5  # 秒

# Agent 决策配置
agent:
  think_timeout_seconds: 60   # 主 Agent 单轮超时
  think_interval: 15            # 决策间隔（秒）
  think_debounce_ms: 5000       # 思考聚合窗口（毫秒）
  context_budget_ratio: 0.6     # 模型输入预算占上下文窗口的比例
  max_step: 13                  # ReAct 图执行步数，包含模型、工具和直接返回节点
  max_coroutine: 3              # 最大并发思考进程数（0表示不限制）

# 聊天行为配置
chat:
  talk_frequency: 0.7       # 聊天频率，0-1，越大越活跃
  typing_simulation: true   # 是否模拟打字延迟
  typing_speed: 6           # 每秒打字速度（字符）
  enable_time_rules: false  # 是否启用时段规则
  time_rules:               # 时段发言频率规则
    - time_range: "03:00-10:00"
      group_id: 0           # 0表示全局
      talk_value: 0.2       # 夜间降低发言频率

  # 防话痨频率限制
  rate_limit:
    enabled: true           # 是否启用
    period_sec: 300         # 统计周期（秒）
    max_messages: 30        # 周期内最大消息数（超过后概率降至最低）
    min_prob: 0.1           # 最小保底概率（即使刷屏也保留 0.1 的插话概率）

# 聊天媒体缓存
media:
  storage_path: "./media"      # 媒体缓存目录，普通图片与表情包分开存放
  max_bytes_mb: 10            # 单个媒体最大体积（MB），表情包同上限
  image_quality: 75           # 普通图片转 webp 的有损质量（1-100）
  narrow_edge: 1080           # 普通图片窄边上限（像素），窄边本来就小于该值时不缩放

# 统一群聊与私聊整理
learning:
  max_step: 25                 # Memory Agent 最大步数
  timeout_seconds: 300        # Memory Agent 单轮超时
  interval_minutes: 5           # 同一会话两次整理的最短间隔，包括失败尝试
  recovery_interval: 60         # 检查待处理任务的间隔，不直接触发模型调用
  batch_size: 50                # 累计到此数量后批量整理，实际输入还受文本预算限制
  max_wait_minutes: 15          # 未满批次时的最长等待条件

# 两档模型配置：都走 OpenAI Responses 端点（/responses），需要工具调用能力
# 已知可用基址：DeepSeek https://api.deepseek.com 、GLM https://open.bigmodel.cn/api/v1 、MiMo https://api.xiaomimimo.com/v1
# 高档模型：用于沐沐实时思考与回复；轻量模型：统一整理话题和知识
model_tiers:
  high:
    api_key: ""        # 留空则使用 MUMU_MODEL_HIGH_API_KEY 环境变量
    base_url: ""       # 留空则使用 MUMU_MODEL_HIGH_BASE_URL 环境变量
    model: ""          # 留空则使用 MUMU_MODEL_HIGH_MODEL 环境变量
    context_window: 131072  # 模型上下文窗口，必填；用于计算上下文预算
    extra_fields: {    # 额外参数（可选）
      "thinking": {
        "type": "disabled"
      },
      "temperature": 0.85
    }
  low:
    api_key: ""        # 留空则使用 MUMU_MODEL_LOW_API_KEY 环境变量
    base_url: ""       # 留空则使用 MUMU_MODEL_LOW_BASE_URL 环境变量
    model: ""          # 留空则使用 MUMU_MODEL_LOW_MODEL 环境变量
    extra_fields: {
      "thinking": {
        "type": "disabled"
      },
      "temperature": 0.7
    }

# Embedding模型配置（用于记忆检索，强制项）
embedding:
  api_key: ""        # 留空则使用 MUMU_EMBEDDING_API_KEY 环境变量
  base_url: ""       # 留空则使用 MUMU_EMBEDDING_BASE_URL 环境变量
  model: ""          # 留空则使用 MUMU_EMBEDDING_MODEL 环境变量
  dimensions: 1536

database:
  dsn: "postgres://mumu:password@127.0.0.1:5432/mumu_bot?sslmode=disable"

# 记忆系统配置
memory:

  # 消息日志清理
  message_log_cleanup:
    enabled: true           # 是否启用自动清理
    interval_hours: 6       # 清理间隔（小时）
    keep_latest: 500       # 每个会话保留最新 N 条消息

# 表情包收藏配置
sticker:
  storage_path: "./stickers"  # 表情包本地存储路径

# HTTP服务配置
server:
  port: 7468

# 管理后台配置
web:
  admin_key: ""

# 调试配置
debug:
  show_prompt: true        # 显示系统提示词
  show_thinking: true      # 显示思考过程
  show_tool_calls: true    # 显示工具调用
