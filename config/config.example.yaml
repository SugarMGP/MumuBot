# MumuBot 配置文件

# 基础配置
app:
  debug: true
  log_level: "debug"  # debug, info, warn, error

# 人格配置
# 静态人格提示词模板位于 config/persona.prompt
# 这里保留运行时需要注入模板的名称、QQ、别名和兴趣等配置
persona:
  name: "沐沐大魔王"
  qq: 123456789
  alias_names:        # 别名列表，这些都可以触发@检测
    - "mumu"
    - "牢沐"
    - "沐沐"
  # 兴趣话题（更容易触发发言）
  interests:
    - "编程"
    - "数码科技"
    - "二次元"
    - "单机游戏"
    - "少女乐队番"
    - "异世界番"
    - "Minecraft"

# OneBot 配置
onebot:
  ws_url: "ws://127.0.0.1:3001"
  access_token: ""
  reconnect_interval: 5  # 秒

# 监听的群
groups:
  - group_id: 123456789
    enabled: true
    extra_prompt: ""        # 群专属额外提示词（可选）

# Agent 决策配置
agent:
  observe_window: 45            # 观察窗口时间（秒）
  think_interval: 15            # 决策间隔（秒）
  think_debounce_ms: 4800       # 思考聚合窗口（毫秒）
  message_buffer_size: 20       # 消息缓冲区大小
  max_step: 12                  # ReAct 最大步数
  max_coroutine: 3              # 最大并发思考进程数（0表示不限制）
  enable_active_retrieval: true # 是否启用主动记忆检索

# 聊天行为配置
chat:
  talk_frequency: 0.7       # 聊天频率，0-1，越大越活跃
  typing_simulation: true   # 是否模拟打字延迟
  typing_speed: 6           # 每秒打字速度（字符）
  enable_time_rules: false  # 是否启用时段规则
  time_rules:               # 时段发言频率规则
    - time_range: "03:00-10:00"
      group_id: 0           # 0表示全局
      talk_value: 0.2       # 夜间降低发言频率

  # 防话痨频率限制
  rate_limit:
    enabled: true           # 是否启用
    period_sec: 300         # 统计周期（秒）
    max_messages: 30        # 周期内最大消息数（超过后概率降至最低）
    min_prob: 0.1           # 最小保底概率（即使刷屏也保留 0.1 的插话概率）

# 学习系统配置
learning:
  enabled: true                 # 是否启用
  interval_minutes: 10          # 学习任务间隔（分钟）
  review_interval_minutes: 45   # 审核任务间隔（分钟）
  max_step: 10                  # 学习 Agent 最大步数
  batch_size: 100               # 每次学习的消息数量限制
  min_msg_count: 5              # 触发学习的最少消息数量

# 三档模型配置（需为 OpenAI 兼容 ChatModel，且都要支持工具调用）
# 高档模型：用于沐沐实时思考与回复，推荐使用 GLM-4.7 或 Deepseek V3.2 等旗舰模型
# 中档模型：用于话题摘要、后台学习、记忆合并，推荐使用 Qwen3.6-35B-A3B 等中端模型
# 轻量模型：用于群风格判定，推荐使用 Qwen3.5-9B 等轻量模型
model_tiers:
  high:
    api_key: ""        # 留空则使用 MUMU_MODEL_HIGH_API_KEY 环境变量
    base_url: ""
    model: ""
    extra_fields: {    # 额外参数（可选）
      "enable_thinking": false,
      "temperature": 0.7,
      "top_p": 0.85,
      "frequency_penalty": 0.15
    }
  mid:
    api_key: ""        # 留空则使用 MUMU_MODEL_MID_API_KEY 环境变量
    base_url: ""
    model: ""
    extra_fields: {}   # 额外参数（可选）
  low:
    api_key: ""        # 留空则使用 MUMU_MODEL_LOW_API_KEY 环境变量
    base_url: ""
    model: ""
    extra_fields: {}   # 额外参数（可选）

# Embedding模型配置（用于记忆检索，强制项）
embedding:
  api_key: ""        # 留空则使用 MUMU_EMBEDDING_API_KEY 环境变量
  base_url: ""
  model: ""

# 多模态视觉模型配置（用于理解图片和表情包）
vision_llm:
  enabled: true      # 是否启用图片理解
  api_key: ""        # 留空则使用 MUMU_VISION_API_KEY 环境变量
  base_url: ""
  model: ""

# 记忆系统配置
memory:
  # MySQL 数据库配置
  mysql:
    host: "127.0.0.1"
    port: 3306
    user: "root"
    password: ""            # 留空则使用 MUMU_MYSQL_PASSWORD 环境变量
    db_name: "mumu_bot"

  # Milvus 向量数据库配置
  milvus:
    address: "localhost:19530"
    db_name: "default"
    collection_name: "mumu_memories"
    vector_dim: 1024        # embedding 维度
    metric_type: "COSINE"   # 相似度度量类型: IP, L2, COSINE

  # 消息日志清理
  message_log_cleanup:
    enabled: true           # 是否启用自动清理
    interval_hours: 6       # 清理间隔（小时）
    keep_latest: 500       # 每个群保留最新N条消息

# 表情包收藏配置
sticker:
  auto_save: true             # 是否自动保存收到的表情包
  storage_path: "./stickers"  # 表情包本地存储路径
  max_size_mb: 2             # 单个表情包最大大小（MB）

# HTTP服务配置
server:
  port: 8080

# 管理后台配置
web:
  admin_key: ""

# 调试配置
debug:
  show_prompt: true        # 显示系统提示词
  show_thinking: true      # 显示思考过程
  show_memory: true        # 显示记忆检索
  show_tool_calls: true    # 显示工具调用
